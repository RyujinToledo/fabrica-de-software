pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks protect --staged -v
    biome:
      glob: "*.{js,ts,cjs,mjs,json}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
