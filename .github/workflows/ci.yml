name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilegio: nenhum job escreve no repositorio, publica pacote ou le segredo.
permissions:
  contents: read

# Um ref, uma execucao. Em pull_request cancela a execucao anterior porque o
# commit velho nao interessa mais. Em push para main nao cancela: cada commit
# da main guarda o resultado do gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do codigo (historico completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CLI em vez da gitleaks-action: em push a action varre so o ultimo commit
      # (--log-opts=-1) e em conta de organizacao exige licenca comercial.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # --redact: o achado aparece como REDACTED no log. Sem isso o valor do
      # segredo vaza de novo no log do CI.
      - name: Varredura do historico completo com redacao
        run: gitleaks detect --config .gitleaks.toml --redact -v

  code-quality:
    name: Lint, Typecheck & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Audit de seguranca de dependencias
        run: pnpm audit --audit-level=high

      - name: Instalar gitleaks (CLI da baseline)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Verificacao da baseline de gitleaks (RF-030)
        run: pnpm security:baseline

      - name: Verificacao de formatacao e lint (Biome)
        run: pnpm biome ci .

      - name: Checagem de tipos (TypeScript)
        run: pnpm tsc --noEmit
