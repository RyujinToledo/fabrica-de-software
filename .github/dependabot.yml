version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    # Um PR por semana com todas as actions: bump de action quase nunca conflita
    # entre si e 10 PRs separados so geram fila e ruido de notificacao.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
